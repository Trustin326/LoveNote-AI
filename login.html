<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Login — LoveNote AI</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<header class="topbar">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:14px">
    <div class="brand">
      <img src="assets/icon-192.png" alt="LoveNote AI"/>
      <div>
        <div class="name">LoveNote AI</div>
        <div class="small">Supabase login</div>
      </div>
    </div>
    <a class="btn secondary" href="index.html" style="text-decoration:none">Back</a>
  </div>
</header>

<main class="container" style="max-width:620px">
  <div class="heroCard" style="padding:18px">
    <h2 style="color:#ff2f9f;letter-spacing:-.02em">Sign in</h2>
    <div class="small">Create an account or log in to access the paid dashboard.</div>

    <label>Email</label>
    <input id="email" placeholder="you@email.com"/>

    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••"/>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button id="loginBtn" class="btn" style="flex:1">Login</button>
      <button id="signupBtn" class="btn secondary" style="flex:1">Create Account</button>
    </div>

    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="badge">Owner bypass is for you</span>
      <button id="ownerBtn" class="btn black">Owner Mode</button>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
<script src="js/supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
