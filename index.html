<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveNote AI</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg,#ffe6f0,#ffd6eb,#fff0f7);
color:#333;
}

header{
padding:20px;
text-align:center;
background: rgba(255,255,255,0.6);
backdrop-filter: blur(10px);
}

h1{
margin:0;
font-size:32px;
color:#d63384;
}

.container{
max-width:900px;
margin:30px auto;
padding:20px;
background:white;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.1);
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.primary{
background: linear-gradient(90deg,#ff4da6,#ff80bf);
color:white;
}

.secondary{
background:#f2f2f2;
}

.result{
margin-top:20px;
padding:15px;
background:#fff0f6;
border-radius:12px;
white-space:pre-wrap;
}

.hidden{
display:none;
}

.tier{
margin-top:10px;
font-weight:bold;
color:#d63384;
}

.footer{
text-align:center;
margin:40px 0;
font-size:13px;
opacity:.6;
}
</style>
</head>

<body>

<header>
<h1>💘 LoveNote AI</h1>
<p>Create the perfect Valentine message in seconds</p>
</header>

<!-- LOGIN -->
<div id="loginBox" class="container">
<h2>Login / Register</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="primary" onclick="login()">Enter LoveNote</button>

<p style="margin-top:15px;font-size:14px">
Owner Demo: owner@lovenote.ai / owner123
</p>
</div>

<!-- APP -->
<div id="appBox" class="container hidden">
<h2>Generate Love Message</h2>

<div class="tier" id="tierLabel"></div>

<select id="tone">
<option>Cute</option>
<option>Deep Romantic</option>
<option>Passionate</option>
<option>Apology</option>
<option>Poetic</option>
</select>

<select id="stage">
<option>New Relationship</option>
<option>Long Term</option>
<option>Married</option>
<option>Long Distance</option>
<option>Complicated 😅</option>
</select>

<textarea id="details" placeholder="Add name, memory, or message idea..."></textarea>

<button class="primary" onclick="generate()">Generate Love Message</button>

<button class="secondary" onclick="upgrade()">Unlock Unlimited (Stripe)</button>

<div id="result" class="result hidden"></div>

<button class="secondary" onclick="copyText()">Copy</button>
<button class="secondary" onclick="downloadText()">Download</button>

<button style="margin-top:20px;background:#eee" onclick="logout()">Logout</button>

</div>

<div class="footer">
LoveNote AI • Valentine Edition
</div>

<script>

// ===== LOGIN SYSTEM =====
let currentUser = null;

function login(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

if(email==="owner@lovenote.ai" && pass==="owner123"){
currentUser={tier:"owner",credits:999};
}else{
currentUser={tier:"free",credits:3};
}

localStorage.setItem("lovenoteUser",JSON.stringify(currentUser));

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("appBox").classList.remove("hidden");

updateTier();
}

function logout(){
localStorage.removeItem("lovenoteUser");
location.reload();
}

window.onload=function(){
let saved=localStorage.getItem("lovenoteUser");
if(saved){
currentUser=JSON.parse(saved);
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("appBox").classList.remove("hidden");
updateTier();
}
}

function updateTier(){
let label=document.getElementById("tierLabel");

if(currentUser.tier==="owner"){
label.innerText="👑 Owner Unlimited Access";
}else if(currentUser.tier==="paid"){
label.innerText="💎 Valentine Unlimited";
}else{
label.innerText="🌸 Free Tier • " + currentUser.credits + " messages left";
}
}

// ===== GENERATOR =====
function generate(){

if(currentUser.tier==="free"){
if(currentUser.credits<=0){
alert("Upgrade to Unlimited ❤️");
return;
}
currentUser.credits--;
localStorage.setItem("lovenoteUser",JSON.stringify(currentUser));
updateTier();
}

let tone=document.getElementById("tone").value;
let stage=document.getElementById("stage").value;
let details=document.getElementById("details").value;

let message = createMessage(tone,stage,details);

let result=document.getElementById("result");
result.classList.remove("hidden");
result.innerText=message;
}

function createMessage(tone,stage,details){

return `
My Love,

Every day with you feels like a dream I never want to wake up from.
Our ${stage.toLowerCase()} journey means everything to me.

${details ? "Thinking about " + details + " makes me smile every time." : ""}

You are my heart, my peace, and my favorite person in this world.

Forever Yours ❤️
`;
}

// ===== COPY / DOWNLOAD =====
function copyText(){
let text=document.getElementById("result").innerText;
navigator.clipboard.writeText(text);
alert("Copied ❤️");
}

function downloadText(){
let text=document.getElementById("result").innerText;
let blob=new Blob([text],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="LoveNote.txt";
a.click();
}

// ===== STRIPE PLACEHOLDER =====
function upgrade(){
alert("Connect Stripe Payment Link Here");
}

</script>

</body>
</html>
