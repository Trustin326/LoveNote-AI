<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveNote AI Deluxe</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff9ad5,#ffd6f5,#a0e7ff,#ffe29a);
}

.container{
max-width:900px;
margin:30px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

h1{color:#ff2e93;text-align:center;}

button{
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
margin:6px;
font-weight:bold;
}

.primary{
background:#ff2e93;
color:white;
}

.secondary{
background:#eee;
}

textarea,input,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
}

.result{
background:#fff0fb;
padding:15px;
border-radius:12px;
margin-top:10px;
white-space:pre-wrap;
}

canvas{
width:100%;
max-height:400px;
border-radius:12px;
margin-top:10px;
}

.section{
margin-top:25px;
padding-top:15px;
border-top:1px solid #eee;
}
</style>
</head>

<body>

<div class="container">

<h1>💘 LoveNote AI Deluxe</h1>

<!-- MESSAGE GENERATOR -->
<div class="section">
<h3>💬 Message Generator</h3>

<select id="relationship">
<option>New Relationship</option>
<option>Breaking Up</option>
<option>Getting Engaged</option>
<option>Newly Engaged</option>
<option>Bride To Be</option>
<option>Groom To Be</option>
<option>Side Chick 😅</option>
<option>Baby Mama</option>
<option>Baby Daddy</option>
</select>

<select id="tone">
<option>Romantic</option>
<option>Funny</option>
<option>Flirty</option>
<option>Apology</option>
</select>

<textarea id="details" placeholder="Add memory, name, joke..."></textarea>

<button class="primary" onclick="generate()">Generate Message</button>
<button class="secondary" onclick="copyMsg()">Copy</button>

<div id="msgOut" class="result"></div>
</div>

<!-- IMAGE TRANSFORM -->
<div class="section">
<h3>📸 Valentine Image Transform</h3>

<input type="file" id="imgUpload">

<button class="primary" onclick="addHearts()">Add Valentine Hearts</button>

<canvas id="imgCanvas"></canvas>
</div>

<!-- MEME GENERATOR -->
<div class="section">
<h3>😂 Meme Generator</h3>

<input id="topText" placeholder="Top Text">
<input id="bottomText" placeholder="Bottom Text">

<button class="primary" onclick="makeMeme()">Generate Meme</button>

<canvas id="memeCanvas"></canvas>
</div>

</div>

<script>

/* MESSAGE */
function generate(){
let r=document.getElementById("relationship").value;
let t=document.getElementById("tone").value;
let d=document.getElementById("details").value;

let msg = `
Hey ❤️

Even during our ${r.toLowerCase()} phase,
you still matter to me.

${d}

— LoveNote AI 💘
`;

document.getElementById("msgOut").innerText = msg;
}

function copyMsg(){
navigator.clipboard.writeText(
document.getElementById("msgOut").innerText
);
alert("Copied!");
}

/* IMAGE */
let imgCanvas=document.getElementById("imgCanvas");
let imgCtx=imgCanvas.getContext("2d");
imgCanvas.width=600;
imgCanvas.height=400;

let uploadedImage=null;

document.getElementById("imgUpload").onchange=e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(){
let img=new Image();
img.onload=function(){
uploadedImage=img;
imgCtx.drawImage(img,0,0,600,400);
}
img.src=reader.result;
}
reader.readAsDataURL(file);
}

function addHearts(){
if(!uploadedImage){alert("Upload image first"); return;}

imgCtx.drawImage(uploadedImage,0,0,600,400);

for(let i=0;i<20;i++){
imgCtx.font="30px serif";
imgCtx.fillText("💘",
Math.random()*600,
Math.random()*400
);
}
}

/* MEME */
let memeCanvas=document.getElementById("memeCanvas");
let memeCtx=memeCanvas.getContext("2d");
memeCanvas.width=600;
memeCanvas.height=600;

function makeMeme(){
let top=document.getElementById("topText").value.toUpperCase();
let bottom=document.getElementById("bottomText").value.toUpperCase();

let grad=memeCtx.createLinearGradient(0,0,600,600);
grad.addColorStop(0,"#ff9ad5");
grad.addColorStop(1,"#a0e7ff");

memeCtx.fillStyle=grad;
memeCtx.fillRect(0,0,600,600);

memeCtx.fillStyle="white";
memeCtx.strokeStyle="black";
memeCtx.lineWidth=4;
memeCtx.font="bold 40px Impact";
memeCtx.textAlign="center";

memeCtx.strokeText(top,300,60);
memeCtx.fillText(top,300,60);

memeCtx.strokeText(bottom,300,550);
memeCtx.fillText(bottom,300,550);

memeCtx.font="80px serif";
memeCtx.fillText("💘",300,300);
}

</script>

</body>
</html>
