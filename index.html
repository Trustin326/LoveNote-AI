<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveNote AI Deluxe</title>

<style>
body{
margin:0;
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#ff9ad5,#ffd6f5,#a0e7ff,#ffe29a);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
max-width:900px;
margin:40px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#ff2e93;
}

select,input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #eee;
}

button{
padding:14px;
border:none;
border-radius:12px;
margin:6px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:linear-gradient(90deg,#ff2e93,#ff7ecf);
color:white;
}

.secondary{
background:#f3f3f3;
}

.result{
margin-top:20px;
padding:15px;
background:#fff0fb;
border-radius:12px;
white-space:pre-wrap;
}

.preview{
margin-top:20px;
text-align:center;
}

.preview img{
max-width:260px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="container">

<h1>💘 LoveNote AI Deluxe</h1>

<select id="relationship">
<option>New Relationship</option>
<option>Long Term</option>
<option>Breaking Up</option>
<option>Getting Engaged</option>
<option>Newly Engaged</option>
<option>Bride To Be</option>
<option>Groom To Be</option>
<option>Sexy Flirty Partner 😏</option>
<option>Baby Daddy</option>
<option>Side Chick 😅</option>
<option>Baby Mama</option>
</select>

<select id="tone">
<option>Cute</option>
<option>Romantic</option>
<option>Funny</option>
<option>Flirty</option>
<option>Apology</option>
</select>

<textarea id="details" placeholder="Memory, inside joke, or name..."></textarea>

<button class="primary" onclick="generate()">Generate Message</button>

<div id="result" class="result"></div>

<hr>

<h3>📸 Upload Photo → Valentine Character Style</h3>

<input type="file" id="imgUpload">

<select id="overlay">
<option>💋 Blow Kiss Hearts</option>
<option>🪽 Cupid Wings</option>
<option>🏹 Bow & Arrow</option>
<option>🌹 Rose In Mouth</option>
<option>👠 Glam High Heel Pose</option>
<option>❤️ Heart Crown</option>
</select>

<button class="primary" onclick="applyOverlay()">Apply Valentine Style</button>

<canvas id="canvas" style="display:none"></canvas>

<div class="preview">
<img id="previewImg">
</div>

<hr>

<h3>📲 Share</h3>

<button class="secondary" onclick="copyText()">Copy</button>
<button class="secondary" onclick="shareSocial()">Share</button>
<button class="secondary" onclick="sendSMS()">Send To Phone</button>

</div>

<script>

function generate(){
let r=document.getElementById("relationship").value;
let t=document.getElementById("tone").value;
let d=document.getElementById("details").value;

let msg=`
Hey ❤️

Even through our ${r.toLowerCase()} phase…
You still mean a lot to me.

${d ? "I keep thinking about " + d + "." : ""}

— Sent with LoveNote AI 💘
`;

document.getElementById("result").innerText=msg;
}

let uploadedImg=null;

document.getElementById("imgUpload").onchange=e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=()=>{
let img=new Image();
img.onload=()=> uploadedImg=img;
img.src=reader.result;
};
reader.readAsDataURL(file);
}

function applyOverlay(){

if(!uploadedImg) return alert("Upload image first");

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

canvas.width=uploadedImg.width;
canvas.height=uploadedImg.height;

ctx.drawImage(uploadedImg,0,0);

ctx.font="60px serif";
ctx.fillText("💘",50,80);

let url=canvas.toDataURL();
document.getElementById("previewImg").src=url;
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("result").innerText);
alert("Copied!");
}

function shareSocial(){
if(navigator.share){
navigator.share({
title:"LoveNote AI",
text:document.getElementById("result").innerText
});
}else alert("Sharing not supported on this device");
}

function sendSMS(){
let text=encodeURIComponent(document.getElementById("result").innerText);
window.location.href="sms:?body="+text;
}

</script>

</body>
</html>
