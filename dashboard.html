
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<h1 class="dash-title">LoveNote AI Dashboard</h1>

<div class="grid">

<div class="card">
<img src="assets/char1.png">
<h2>AI Message Generator</h2>
<input placeholder="Recipient Name">
<select><option>Romantic</option><option>Funny</option></select>
<input type="file">
<button class="btn">Send Message</button>
</div>

<div class="card">
<img src="assets/char2.png">
<h2>Meme Creator</h2>
<input placeholder="Top Text">
<input placeholder="Bottom Text">
<input type="file">
<button class="btn">Generate Meme</button>
</div>

<div class="card">
<img src="assets/char3.png">
<h2>Greeting Card Builder</h2>
<input placeholder="Recipient">
<input placeholder="Message">
<input type="file">
<button class="btn">Create Card</button>
</div>

<div class="card">
<img src="assets/char4.png">
<h2>Photo Transform</h2>
<select><option>Dreamy Romantic</option></select>
<input type="file">
<button class="btn">Transform Photo</button>
</div>

</div>

</body>
</html>
